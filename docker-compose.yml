services:
  app:
    container_name: housing_panda_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB_NAME: postgres
      PORT: 5050
      SSL_MODE: disable
    depends_on:
      - db
  db:
    image: postgres
    container_name: housing_panda_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pg_db:/var/lib/postgresql/data
volumes:
  pg_db:
    driver: local